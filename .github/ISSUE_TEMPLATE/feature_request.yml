name: Idea / new tool
description: Suggest a tool, a lecture topic or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you add, and why?
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options: ["Yes, assign me", "Maybe, with some help", "No, just the idea"]
